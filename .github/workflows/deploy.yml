name: Deploy to COS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Restore map tiles
        id: map-tiles
        uses: actions/cache@v5
        with:
          path: public/map/tiles/512
          key: map-tiles-${{ hashFiles('maptiler/full.png', 'maptiler/main.py', 'maptiler/requirements.txt') }}

      - name: Download map source
        if: steps.map-tiles.outputs.cache-hit != 'true'
        run: git lfs pull --include="maptiler/full.png"

      - uses: actions/setup-python@v6
        if: steps.map-tiles.outputs.cache-hit != 'true'
        with:
          python-version: '3.13'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate map tiles
        if: steps.map-tiles.outputs.cache-hit != 'true'
        run: |
          python -m pip install -r maptiler/requirements.txt
          pnpm maptiler

      - name: Validate map tiles
        run: test "$(find public/map/tiles/512 -type f -name '*.webp' | wc -l)" -eq 2741

      - run: pnpm typecheck
      - run: pnpm generate
      - run: pnpm verify

      - name: Install COSCLI
        # Pull from the official tencentyun/coscli GitHub release so the sha256
        # digest lives next to an immutable tag instead of a CDN URL that
        # Tencent rotates without notice.
        env:
          COSCLI_VERSION: v1.0.9
        run: |
          BINARY="coscli-${COSCLI_VERSION}-linux-amd64"
          curl -fsSLo coscli "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/${BINARY}"
          EXPECTED=$(curl -fsSL "https://api.github.com/repos/tencentyun/coscli/releases/tags/${COSCLI_VERSION}" \
            | jq -r --arg name "$BINARY" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")')
          [ -n "$EXPECTED" ] || { echo "::error::unable to fetch coscli digest for ${BINARY}"; exit 1; }
          echo "${EXPECTED}  coscli" | sha256sum --check --strict
          chmod +x coscli

      - name: Deploy
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          TENCENT_CLOUD_BUCKET: ${{ vars.TENCENT_CLOUD_BUCKET }}
          TENCENT_CLOUD_REGION: ${{ vars.TENCENT_CLOUD_REGION }}
          TENCENT_CLOUD_ENDPOINT: ${{ vars.TENCENT_CLOUD_ENDPOINT }}
        run: |
          ./coscli config set --secret_id "$TENCENT_CLOUD_SECRET_ID" --secret_key "$TENCENT_CLOUD_SECRET_KEY"
          ./coscli config add --bucket "$TENCENT_CLOUD_BUCKET" --region "$TENCENT_CLOUD_REGION" --endpoint "$TENCENT_CLOUD_ENDPOINT" --alias site
          ./coscli sync .output/public/ cos://site/ --recursive --delete --force --routines 64

      - name: Purge EdgeOne HTML cache
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
          ZONE_ID: ${{ vars.EO_ZONE_ID }}
          TARGETS: "https://ysumc.net/ https://ysumc.net/index.html"
        run: bash scripts/edgeone-purge.sh
